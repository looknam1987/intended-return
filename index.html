<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logistics Return & Summary Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.25rem;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 220px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-size: 1rem;
    }
    .btn:hover { background-color: var(--primary-dark); }
    .btn-summary { background-color: #2563eb; }
    .btn-summary:hover { background-color: #1d4ed8; }
    .field-group {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .field-group label {
      font-weight: bold;
      font-size: 0.85rem;
    }
    .field-group input {
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Input Section -->
  <div class="card">
    <h2>1. วางข้อความดิบ (Raw Text)</h2>
    <textarea id="rawInput" placeholder="วางข้อความดิบที่นี่..."></textarea>
    <button class="btn" onclick="parseText()">⚡ แปลงข้อมูล (Parse Data)</button>
  </div>

  <!-- Parsed Result & Export Section -->
  <div class="card">
    <h2>2. ตรวจสอบข้อมูล & Export</h2>
    <div id="parsedFields">
      <div class="field-group"><label>REF:</label><input type="text" id="ref"></div>
      <div class="field-group"><label>Tracking เดิม:</label><input type="text" id="oldTracking"></div>
      <div class="field-group"><label>Tracking ใหม่:</label><input type="text" id="newTracking"></div>
      <div class="field-group"><label>ชื่อลูกค้า:</label><input type="text" id="custName"></div>
      <div class="field-group"><label>เบอร์โทร:</label><input type="text" id="phone"></div>
      <div class="field-group"><label>ที่อยู่:</label><input type="text" id="address"></div>
      <div class="field-group"><label>อำเภอ:</label><input type="text" id="amphoe"></div>
      <div class="field-group"><label>จังหวัด:</label><input type="text" id="province"></div>
      <div class="field-group"><label>รหัสไปรษณีย์:</label><input type="text" id="postcode"></div>
      <div class="field-group"><label>สินค้า:</label><input type="text" id="item"></div>
      <div class="field-group"><label>จำนวน (QTY):</label><input type="text" id="qty"></div>
      <div class="field-group"><label>CLIENT/CC:</label><input type="text" id="clientCode"></div>
    </div>

    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e5e7eb;">
    
    <button class="btn" onclick="exportFormMail()">📄 1. โหลด Excel ฟอร์มส่งเมล (ตารางพาสเทลสวยงาม)</button>
    <button class="btn btn-summary" onclick="exportSummary()">📊 2. โหลด Excel ไฟล์ Summary (30 คอลัมน์)</button>
  </div>
</div>

<script>
  function parseText() {
    const raw = document.getElementById('rawInput').value;
    
    const refMatch = raw.match(/REF:\s*([^\n]+)/i);
    const trackingMatch = raw.match(/Tracking:\s*([^\n]+)/i);
    const nameMatch = raw.match(/ชื่อ:\s*([^\n]+)/i);
    const phoneMatch = raw.match(/โทร:\s*([^\n]+)/i);
    const addrMatch = raw.match(/ที่อยู่:\s*([^\n]+)/i);
    const itemMatch = raw.match(/สินค้า:\s*([^\n]+)/i);

    let ref = refMatch ? refMatch[1].trim() : '';
    let oldTrack = trackingMatch ? trackingMatch[1].trim() : '';
    let newTrack = oldTrack ? `THFHQ${oldTrack}RT` : '';
    let name = nameMatch ? nameMatch[1].trim().replace(/^'/, '') : '';
    let rawPhone = phoneMatch ? phoneMatch[1].trim() : '';
    let phone = rawPhone.startsWith('66') ? '0' + rawPhone.slice(2) : rawPhone;
    let addr = addrMatch ? addrMatch[1].trim().replace(/^'/, '') : '';
    let itemFull = itemMatch ? itemMatch[1].trim() : '';

    let clientCode = itemFull.substring(0, 3).toUpperCase();
    let qtyMatch = itemFull.match(/(\d+)\s*(BOX|ชิ้น|กล่อง)/i) || itemFull.match(/\b(\d+)\b/);
    let qty = qtyMatch ? qtyMatch[1] : '1';
    let itemNo = itemFull.split(/\s+/)[0];

    let postMatch = addr.match(/\b\d{5}\b/);
    let postcode = postMatch ? postMatch[0] : '';

    let province = '';
    let amphoe = '';
    
    if (addr.includes('กรุงเทพ') || addr.includes('กทม')) {
      province = 'กรุงเทพมหานคร';
      let bkkAmphoe = addr.match(/(เขต[^\s]+|แขวง[^\s]+)/);
      amphoe = bkkAmphoe ? bkkAmphoe[0] : 'กรุงเทพมหานคร';
    } else {
      let provMatch = addr.match(/(จังหวัด[^\s]+|\s[ก-ฮ]{2,}[บุรี|ธานี|นคร|กาฬสินธุ์|พนม|แพร่|น่าน|ยะลา|ตรัง|ระยอง|ปทุมธานี]+)/);
      province = provMatch ? provMatch[0].replace('จังหวัด', '').trim() : '';
      let ampMatch = addr.match(/(อำเภอ[^\s]+|อ\.[^\s]+)/);
      amphoe = ampMatch ? ampMatch[0] : '';
    }

    document.getElementById('ref').value = ref;
    document.getElementById('oldTracking').value = oldTrack;
    document.getElementById('newTracking').value = newTrack;
    document.getElementById('custName').value = name;
    document.getElementById('phone').value = phone;
    document.getElementById('address').value = addr;
    document.getElementById('amphoe').value = amphoe;
    document.getElementById('province').value = province;
    document.getElementById('postcode').value = postcode;
    document.getElementById('item').value = itemNo;
    document.getElementById('qty').value = qty;
    document.getElementById('clientCode').value = clientCode;
  }

  function getFormattedDate() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function sanitizeFilename(str) {
    return (str || 'Customer').replace(/[\\/*?:"<>|]/g, '').trim();
  }

  // 1. Export Form S1 (ถอดแบบภาพที่ 2 สวยงาม 100%)
  async function exportFormMail() {
    if (typeof ExcelJS === 'undefined') {
      alert('ระบบกำลังโหลดไลบรารี Excel กรุณารอ 2-3 วินาทีแล้วลองอีกครั้งครับ');
      return;
    }
    const workbook = new ExcelJS.Workbook();
    const sheet = workbook.addWorksheet('Sheet1');

    sheet.views = [{ showGridLines: true }];

    // Row 1 - 3 Data
    sheet.addRow(['Intended Return (Pickup)', '']);
    sheet.addRow(['EKP no. : 5280551024', '']);
    sheet.addRow(['Pick up no. : 0005376582', '']);
    sheet.addRow([]); // Blank Row 4

    // Row 5 & 6 Header Data
    sheet.addRow([
      'วันที่เข้ารับ', 
      'Shipment ID\n(Tracking Number ใหม่)',
      'รายละเอียดที่อยู่สำหรับเข้ารับสินค้า', '', '', '', '',
      'รายละเอียดสำหรับที่อยู่นำส่ง', '', '', '',
      'รายละเอียดสำหรับที่อยู่ส่งคืน', '', '', ''
    ]);

    sheet.addRow([
      '', '', 
      'ชื่อ', 'ที่อยู่', 'รหัสไปรษณีย์', 'เบอร์โทรศัพท์', 'หมายเหตุเพิ่มเติม',
      'ชื่อ', 'ที่อยู่', 'รหัสไปรษณีย์', 'เบอร์โทรศัพท์',
      'ชื่อ', 'ที่อยู่', 'รหัสไปรษณีย์', 'เบอร์โทรศัพท์'
    ]);

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dateStr = tomorrow.toLocaleDateString('en-US');

    // Row 7 Data
    sheet.addRow([
      dateStr,
      document.getElementById('newTracking').value,
      document.getElementById('custName').value,
      document.getElementById('address').value,
      document.getElementById('postcode').value,
      document.getElementById('phone').value,
      '',
      'Smart One Logistics',
      'อาคารอโยธยา ทาวเวอร์ ชั้น19  240/37 ถนนรัชดาภิเษก เเขวงห้วยขวาง เขตห้วยขวาง กรุงเทพมหานคร',
      '10310', '0908903055',
      'Smart One Logistics',
      'อาคารอโยธยา ทาวเวอร์ ชั้น19  240/37 ถนนรัชดาภิเษก เเขวงห้วยขวาง เขตห้วยขวาง กรุงเทพมหานคร',
      '10310', '0908903055'
    ]);

    // Border Definitions
    const borderThin = {
      top: { style: 'thin', color: { argb: '7F7F7F' } },
      left: { style: 'thin', color: { argb: '7F7F7F' } },
      bottom: { style: 'thin', color: { argb: '7F7F7F' } },
      right: { style: 'thin', color: { argb: '7F7F7F' } }
    };

    // Apply Style Row 1-3 (Top Header)
    sheet.mergeCells('A1:B1');
    sheet.mergeCells('A2:B2');
    sheet.mergeCells('A3:B3');

    sheet.getCell('A1').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'DDEBF7' } }; // ฟ้าอ่อน
    sheet.getCell('A1').font = { bold: true, size: 11, color: { argb: '000000' } };
    
    sheet.getCell('A2').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FCE4D6' } }; // ส้มอ่อน
    sheet.getCell('A2').font = { size: 11, color: { argb: '000000' } };

    sheet.getCell('A3').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FCE4D6' } }; // ส้มอ่อน
    sheet.getCell('A3').font = { size: 11, color: { argb: '000000' } };

    for (let r = 1; r <= 3; r++) {
      for (let c = 1; c <= 2; c++) {
        sheet.getCell(r, c).border = borderThin;
        sheet.getCell(r, c).alignment = { vertical: 'middle', horizontal: 'left' };
      }
    }

    // Merge Cells Row 5 & 6
    sheet.mergeCells('A5:A6');
    sheet.mergeCells('B5:B6');
    sheet.mergeCells('C5:G5');
    sheet.mergeCells('H5:K5');
    sheet.mergeCells('L5:O5');

    // Fill Color: Pastel Green (C6EFCE) and Dark Green Text (006100) like Image 2
    const pastelGreenFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'C6EFCE' } };
    const fontHeader = { bold: true, color: { argb: '006100' }, size: 10 };

    // Apply Header Styles to Row 5, 6, 7
    for (let r = 5; r <= 7; r++) {
      for (let c = 1; c <= 15; c++) {
        const cell = sheet.getCell(r, c);
        cell.border = borderThin; // ใส่เส้นขอบทุกช่อง
        cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };

        if (r === 5 || r === 6) {
          cell.fill = pastelGreenFill;
          cell.font = fontHeader;
        }
      }
    }

    // Data Alignment Adjustments
    sheet.getCell('C7').alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
    sheet.getCell('D7').alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
    sheet.getCell('I7').alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };
    sheet.getCell('N7').alignment = { vertical: 'middle', horizontal: 'left', wrapText: true };

    // Column Widths
    sheet.columns = [
      { width: 14 }, { width: 30 }, { width: 22 }, { width: 42 }, { width: 14 },
      { width: 16 }, { width: 16 }, { width: 22 }, { width: 42 }, { width: 14 },
      { width: 16 }, { width: 22 }, { width: 42 }, { width: 14 }, { width: 16 }
    ];

    const custName = sanitizeFilename(document.getElementById('custName').value);
    const dateExport = getFormattedDate();
    const filename = `${custName}_IntendedReturn_${dateExport}.xlsx`;

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

  // 2. Export Summary File (30 Columns)
  async function exportSummary() {
    if (typeof ExcelJS === 'undefined') {
      alert('ระบบกำลังโหลดไลบรารี Excel กรุณารอ 2-3 วินาทีแล้วลองอีกครั้งครับ');
      return;
    }
    const workbook = new ExcelJS.Workbook();
    const sheet = workbook.addWorksheet('Sheet1');

    sheet.views = [{ showGridLines: true }];

    const headers = [
      'CLIENT', 'SO_NO', 'LINE_NO', 'CUSTOMER CODE', 'SO_TYPE', 'ORDER NO.', 'DATE',
      'REFERENCE_NO', 'Remarks', 'ITEM_NO', 'QTY', 'UOM', 'CUSTOMER_NAME', 'CONTACT_PERSON',
      'ที่อยู่', 'ซอย', 'ถนน', 'ตำบล', 'อำเภอ', 'จังหวัด', 'COUNTRY', 'POST', 'PHONE',
      'Whse_source', 'WI_SQLSTATUS', 'WI_SQLMSG', 'CC', 'วันที่ลูกค้าส่งไฟล์มา', 'mail to DHL', 'Delivery Tracking'
    ];
    sheet.addRow(headers);

    const todayStr = getFormattedDate();

    const rowData = [
      document.getElementById('clientCode').value,
      '', 1, '', '', '', '',
      document.getElementById('ref').value,
      '',
      document.getElementById('item').value,
      parseInt(document.getElementById('qty').value) || 1,
      '',
      document.getElementById('custName').value,
      '', '', '', '', '',
      document.getElementById('amphoe').value,
      document.getElementById('province').value,
      '',
      document.getElementById('postcode').value,
      '', '', '', '',
      document.getElementById('clientCode').value,
      '',
      todayStr,
      document.getElementById('newTracking').value
    ];

    sheet.addRow(rowData);

    const headerRow = sheet.getRow(1);
    headerRow.font = { bold: true, color: { argb: 'FFFFFF' } };
    headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '366092' } };
    
    for (let col = 1; col <= 30; col++) {
      sheet.getCell(1, col).border = {
        top: { style: 'thin', color: { argb: 'BFBFBF' } },
        left: { style: 'thin', color: { argb: 'BFBFBF' } },
        bottom: { style: 'thin', color: { argb: 'BFBFBF' } },
        right: { style: 'thin', color: { argb: 'BFBFBF' } }
      };
      sheet.getCell(2, col).border = {
        top: { style: 'thin', color: { argb: 'BFBFBF' } },
        left: { style: 'thin', color: { argb: 'BFBFBF' } },
        bottom: { style: 'thin', color: { argb: 'BFBFBF' } },
        right: { style: 'thin', color: { argb: 'BFBFBF' } }
      };
    }

    const custName = sanitizeFilename(document.getElementById('custName').value);
    const filename = `Summary_DHL_${custName}_${todayStr}.xlsx`;

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }
</script>

</body>
</html>
